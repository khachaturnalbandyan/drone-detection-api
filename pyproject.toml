[project]
name = "drone-detection-api"
version = "1.0.0"
description = "Production-style serving for a YOLOv8 drone detector: FastAPI, ONNX Runtime, dynamic batching, PostgreSQL."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
